# /etc/aimodel.conf: aimodel pull がモデル (GGUF) を取ってくるところ
# URL: モデルそのもの (大きくなって releases などに移したら、ここを書きかえる)
URL=https://git.syui.ai/ai/repo/raw/branch/main/model/ai.gguf
# API: 変わったかを見るところ (Gitea の contents API の sha と size。取ったものもこれで確かめる)。
# 空なら、置いてあれば取らない (aimodel pull -f でいつも取る)
API=https://git.syui.ai/api/v1/repos/ai/repo/contents/model/ai.gguf?ref=main
