# /etc/aimodel.conf: aimodel pull がモデル (GGUF) を取ってくるところ
# URL: モデルそのもの (git.syui.ai の ai/os のリリース model。bin/gitea.sh model ai.gguf で置く)
URL=https://git.syui.ai/ai/os/releases/download/model/ai.gguf
# SUM: その sha256 (sha256sum の形)。変わったかを見て、取ったものもこれで確かめる (読めなければ何もしない)
SUM=https://git.syui.ai/ai/os/releases/download/model/ai.gguf.sha256
# API: SUM が空のときに、Gitea の contents API の sha (git の blob の sha1) と size で確かめる (git に置いたもの。
# たとえば https://git.syui.ai/api/v1/repos/ai/repo/contents/model/ai.gguf?ref=main)。
# どちらも空なら、置いてあれば取らない (aimodel pull -f でいつも取る)
API=
