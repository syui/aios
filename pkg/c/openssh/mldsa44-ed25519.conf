# aios: mldsa44-ed25519 (ML-DSA-44 と Ed25519 をあわせた、量子計算機に強い署名) の鍵だけで入れる。
# ホストの鍵もユーザーの鍵も (証明書なら CA の署名も) mldsa44-ed25519 だけ、パスワードでは入れない。
# ed25519 の鍵やパスワードでも入れたいなら、このファイルを消して sshd をやりなおす (systemctl restart sshd)
HostKey /etc/ssh/ssh_host_mldsa44_ed25519_key
HostKeyAlgorithms ssh-mldsa44-ed25519-cert,ssh-mldsa44-ed25519
PubkeyAcceptedAlgorithms ssh-mldsa44-ed25519-cert,ssh-mldsa44-ed25519
CASignatureAlgorithms ssh-mldsa44-ed25519
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
