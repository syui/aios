# aish のプラグイン (aish とは別のプログラム。1 行 1 つの JSON で話す。README.md)
#   plugin:   SDK (aish-plugin クレート)。プラグインはこれを使って書く
#   complete: Tab の補完              suggest: グレーの候補 (履歴から)
#   highlight: 打っている行の色 (zsh-syntax-highlighting)   time: 長くかかったものの時間としくじった終了コード
#   pick:     C-r C-f C-j C-k C-p C-p (絞りこみの選択、cd ..、端末へのコピー)
#   edit:     ファイルを読む、ぴったり置きかえる、書く、取り消す (端末なしの tools だけ。Claude が使う)
#   wait:     プロセスが終わる、ファイルに文字が出る、ポートが開く、まで待つ (tools だけ)
#   fix:      ビルドのエラーを番号つきの一覧に (vim の quickfix)。うしろでビルドして待てる
#   sys:      aios の様子 (まとめ、プロセス、カーネルのメッセージ、ログ、BKL、strace)
#   powerline: powerline のプロンプト ([shell] リポジトリの aish-powerline)
[workspace]
resolver = "2"
members = ["plugin", "complete", "suggest", "highlight", "time", "pick", "edit", "wait", "map", "fix", "sys", "pkg", "claude", "powerline"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde_json = "1"
aish-plugin = { path = "plugin" }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
