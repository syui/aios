# Installed to /etc/sysctl.d/50-aios-hardening.conf
kernel.kptr_restrict = 2
# MPTCP is built in (CONFIG_MPTCP=y), so it can't be blacklisted; turn it off
# here. Go 1.24+ (MPTCP listeners by default) falls back to plain TCP.
# Per netns: docker / private-network containers still default to 1.
net.mptcp.enabled = 0
dev.tty.ldisc_autoload = 0
kernel.kexec_load_disabled = 1
# No io_uring user on aios/at/arch (2026-10-30); set 0 again if one needs it.
kernel.io_uring_disabled = 2
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
# Server-only (ssh at): rootful docker does not need it. Leave commented on
# desktop hosts, where browsers / flatpak need unprivileged user namespaces.
#kernel.unprivileged_userns_clone = 0
