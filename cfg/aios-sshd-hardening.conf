# Installed to /etc/ssh/sshd_config.d/00-aios-hardening.conf. 00- so it sorts
# before systemd's 20-systemd-userdb.conf: sshd keeps the first value it reads,
# and that file adds `userdbctl ssh-authorized-keys` as a second key source.
AuthorizedKeysCommand none
AuthenticationMethods publickey
PermitRootLogin no
