#!/usr/bin/nft -f

destroy table inet aios-fw

table inet aios-fw {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state invalid drop
		ct state established,related accept
		iif "lo" accept
		ip protocol icmp accept
		tcp dport 2222 accept
		udp sport 67 udp dport 68 accept
		iifname "ve-*" accept
		meta pkttype host limit rate 6/minute log prefix "aios-fw in: "
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state invalid drop
		ct state established,related accept
		iifname "ve-*" accept
		meta pkttype host limit rate 6/minute log prefix "aios-fw fwd: "
	}
}
