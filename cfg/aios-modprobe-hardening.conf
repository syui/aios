# Rarely-used network protocols / crypto API / drivers: common LPE entry points
# that are autoloaded by an unprivileged socket() call. Installed to
# /etc/modprobe.d/aios-hardening.conf. Deliberately NOT blocked: esp4/esp6,
# xfrm_user (IPsec), overlay, nf_tables, veth, bridge (docker / nspawn).
install rds /bin/false
install tipc /bin/false
install atm /bin/false
install ieee802154 /bin/false
install can /bin/false
install nfc /bin/false
install sctp /bin/false
install af_key /bin/false
install vsock /bin/false
install af_alg /bin/false
# Not used here; named in the 2026-10 ZDI leak on LKML
install ksmbd /bin/false
install nvmet /bin/false
install vmwgfx /bin/false
# No VMs on these hosts (ssh at confirmed unused). Remove these two lines on
# a host that runs qemu/libvirt/Android emulators.
install kvm_intel /bin/false
install kvm /bin/false
