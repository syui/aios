# /etc/aipkg.conf (pacman.conf と同じ書き方)
# $repo はリポジトリ名、$arch は aarch64 に置き換わる

[options]
Architecture = aarch64

[aios]
# file:// http:// https:// が使える
Server = https://git.syui.ai/ai/repo/raw/branch/main/$arch

# C の拡張 (Zig で作った静的なバイナリ。/opt/c に入る)。使うなら # をはずして aipkg -Sy、
# C をビルドする環境は aipkg -S base-devel (zig, cc, make ...)
#[aios-c]
#Server = https://git.syui.ai/ai/repo/raw/branch/main/$arch-c
