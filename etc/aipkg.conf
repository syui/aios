# /etc/aipkg.conf (pacman.conf と同じ書き方)
# $repo はリポジトリ名 (rust, c, shell)、$arch は aarch64 に置き換わる。
# データベースはどのリポジトリも Server のところの aios.db

[options]
Architecture = aarch64

# aios の本体 (Rust)
[rust]
# file:// http:// https:// が使える
Server = https://git.syui.ai/ai/repo/raw/branch/main/$arch/$repo

# C の拡張 (Zig で作った静的なバイナリ。/opt/c に入る)。使うなら # をはずして aipkg -Sy、
# C をビルドする環境は aipkg -S base-devel (zig, cc, ar ...)
#[c]
#Server = https://git.syui.ai/ai/repo/raw/branch/main/$arch/$repo

# aish の拡張 (aish-powerline など。/usr/share/aish/plugins に入り、~/.aishrc で source する)
[shell]
Server = https://git.syui.ai/ai/repo/raw/branch/main/$arch/$repo
