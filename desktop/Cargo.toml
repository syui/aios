# aios のデスクトップ ([desktop] リポジトリのパッケージになる)。最小構成には入らない
[package]
name = "aios-desktop"
version = "0.0.1"
edition = "2024"
license = "MIT"

[[bin]]
name = "aisplash"
path = "src/bin/aisplash.rs"

[[bin]]
name = "aiwm"
path = "src/bin/aiwm.rs"

[[bin]]
name = "aiterm"
path = "src/bin/aiterm.rs"

[dependencies]
libc = "0.2"
# フォント (aifont) を点にする (使う字だけそのときに読む) / PNG (アイコン) を読む。どちらも Rust だけのもの
ab_glyph = "0.2"
png = "0.18"

[profile.release]
panic = "abort"
strip = true
