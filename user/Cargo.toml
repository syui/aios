[package]
name = "aios-user"
version = "0.0.1"
edition = "2024"
license = "MIT"

[[bin]]
name = "init"
path = "src/bin/init.rs"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "sh"
path = "src/bin/sh.rs"

[[bin]]
name = "aipkg"
path = "src/bin/aipkg.rs"

[[bin]]
name = "fetch"
path = "src/bin/fetch.rs"

[dependencies]
libc = "0.2"
ruzstd = "0.9"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.10", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

