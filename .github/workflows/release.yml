name: release

# linux ブランチ (前の main): Arch Linux の aios (x86_64) を作り、ghcr.io/syui/aios と、リリース linux
# (タイトル aios、aios-x86_64.tar.gz、ノートの 1 行目が版 * vYYYY.MM.DD) に置く。
# いまの aios (aarch64 のディスク) は main ブランチのリリース latest
on:
  push:
    branches:
    - linux
    paths-ignore:
    - '.gitea/**'
    - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build aios
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/work -w /work \
            archlinux:latest \
            bash -c "pacman -Sy --noconfirm arch-install-scripts zsh && zsh ./build.zsh"

      - name: Push to GitHub Container Registry
        run: |
          cat aios.tar.gz | docker import - ghcr.io/syui/aios
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/syui/aios

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/syui/aios | cut -d@ -f2)
          cosign sign --yes ghcr.io/syui/aios@${DIGEST}

      - name: Create new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # タグ linux はブランチ linux と同じ名前なので、git でタグを押さずに gh にコミットで作らせる
          mv aios.tar.gz aios-x86_64.tar.gz
          gh release delete linux --yes --cleanup-tag || true
          gh release create linux aios-x86_64.tar.gz --title aios --notes "* v$(date +%Y.%m.%d)" --target "$GITHUB_SHA"
