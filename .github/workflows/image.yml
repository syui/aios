# image: aios のパッケージから、distroless のような小さな container image (OCI) を作り、docker run でたしかめて
# ghcr.io に置く (ghcr.io/syui/aios-static, aios-cc, aios-node。タグは中心のパッケージの版と latest)。
# ghcr.io/syui/aios は builder (base をまるごと: docker build の FROM にして ap -Sy で足す)。docker/ の見本 (Dockerfile と
# compose.yml) をその場で作った image で docker build して、compose の守りのまま起こしてたしかめる
#   作りかたは ap image (user/src/lib/oci.rs)、中身は image/*.json (パッケージ、要るファイル、config)。
#   ELF の要るもの (PT_INTERP、DT_NEEDED) をたどって、使うファイルだけを入れる。シェルもパッケージマネージャもない。
#   docker を使わずに作るので、同じパッケージからは、いつどこで (aios の中でも) 作っても同じ digest になる
#   動くとき: 1 日 1 回 (ai/repo のパッケージが新しくなっていれば、新しい digest)、image/ と ap image を変えた push、手で。
#   ghcr.io にもう同じ digest があれば push しない
name: image

on:
  schedule:
  - cron: '41 4 * * *'
  push:
    branches:
    - main
    paths:
    - 'image/**'
    - 'docker/**'
    - 'user/src/lib/oci.rs'
    - 'user/src/lib/ocistore.rs'
    - 'user/src/bin/aipkg.rs'
    - 'etc/aipkg.conf'
    - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    name: Image
    # arm64 の Linux: aios (aarch64) の image をそのまま docker run できる
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          # skopeo: OCI のアーカイブを docker と ghcr.io へ (digest を変えずに)。musl-tools: aios-cc をためす musl の動的なバイナリ
          sudo apt-get install -y --no-install-recommends build-essential curl skopeo musl-tools
          # arm64 の Ubuntu では、ふつうの gcc が aarch64-linux-gnu-gcc (ring の C の部分に。user/.cargo/config.toml)
          command -v aarch64-linux-gnu-gcc

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl

      - name: Build ap
        # aios の aipkg (ap) そのもの (aarch64 の musl の静的なバイナリ。この arm64 の Linux でそのまま動く)
        run: cd user && cargo build --release --bin aipkg

      - name: Build images
        run: |
          ap=user/target/aarch64-unknown-linux-musl/release/aipkg
          mkdir -p out
          for f in image/*.json; do
            n=$(basename "$f" .json)
            "$ap" image --conf etc/aipkg.conf -o "out/$n.tar" "$f" | tee "out/$n.log"
            # もう一度作って、1 バイトもちがわないか (パッケージはキャッシュから)
            "$ap" image --conf etc/aipkg.conf -o "out/$n.again.tar" "$f" > /dev/null
            cmp "out/$n.tar" "out/$n.again.tar"
            rm "out/$n.again.tar"
            # image: NAME:VER sha256:DIGEST (OUT)
            awk '/^image: /{print $2, $3}' "out/$n.log" > "out/$n.ref"
          done
          ls -l out

      - name: Test with docker
        run: |
          # OCI のアーカイブを docker のふつうの形 (docker-archive) にして docker load
          # (skopeo の docker-daemon: は古い API の版で話すので、新しい Docker にはことわられる)
          # 名前は image の名前 (aios、aios-static ...) に :ci
          for f in out/*.ref; do
            n=$(basename "$f" .ref)
            read -r ref digest < "$f"
            skopeo copy -q "oci-archive:out/$n.tar" "docker-archive:out/$n.docker.tar:${ref%%:*}:ci"
            docker load -i "out/$n.docker.tar"
          done
          docker images 'aios*'

          # node: 版、nonroot (65532)、書けるところ、CA 証明書、https
          docker run --rm aios-node:ci -e '
            const os = require("os"), fs = require("fs"), tls = require("tls");
            console.log(process.version, process.arch, os.userInfo().username, process.getuid(), os.homedir(), process.cwd());
            console.log(fs.readFileSync("/etc/os-release", "utf8").split("\n")[0], "certs", tls.rootCertificates.length);
            fs.writeFileSync("/tmp/x", "ok"); fs.writeFileSync(os.homedir() + "/x", "ok");
            if (process.getuid() !== 65532) process.exit(1);
            require("https").get("https://registry.npmjs.org/", r => { console.log("https", r.statusCode); process.exit(r.statusCode === 200 ? 0 : 1) })
              .on("error", e => { console.error(e.message); process.exit(1) });'
          # シェルはない
          if docker run --rm --entrypoint /bin/sh aios-node:ci -c true; then echo "aios-node has a shell"; exit 1; fi

          printf '#include <stdio.h>\nint main(void) { puts("hello from aios"); return 0; }\n' > out/hello.c
          # static: 静的なバイナリ
          gcc -static -O2 -o out/hello-static out/hello.c
          docker run --rm -v "$PWD/out/hello-static:/hello:ro" aios-static:ci /hello
          # cc: musl で動的にリンクしたバイナリ (/lib/ld-musl-aarch64.so.1 と libc.so)
          musl-gcc -O2 -o out/hello-musl out/hello.c
          readelf -l out/hello-musl | grep -o 'interpreter: [^]]*'
          docker run --rm -v "$PWD/out/hello-musl:/hello:ro" aios-cc:ci /hello

          # aios (builder): base がまるごと入っていて、ap が入れたものを知っている (/var/lib/aipkg/local)。/bin/sh は aish
          docker run --rm aios:ci sh -c 'cat /etc/os-release | head -1; ap -Q | wc -l; ap -Qo /usr/bin/ap'

      - name: Test docker/ (Dockerfile and compose.yml)
        run: |
          # 多段の docker build: builder (aios) で ap -Sy cargo と cargo build --locked、aios-static に入れる。
          # image はその場で作ったもの (Dockerfile の digest のかわりに)
          docker build -t aios-serve:local --build-arg AIOS=aios:ci --build-arg AIOS_STATIC=aios-static:ci docker
          docker images aios-serve
          # compose の守りのまま起こし (読むだけの根、cap なし、no-new-privileges、65532、init、sysctls)、healthy を待つ
          docker compose -f docker/compose.yml up -d --no-build
          cid=$(docker compose -f docker/compose.yml ps -q aios)
          st=
          for i in $(seq 1 30); do
            st=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            [ "$st" = healthy ] && break
            sleep 2
          done
          docker compose -f docker/compose.yml logs
          echo "health: $st"
          [ "$st" = healthy ]
          curl -fsS http://127.0.0.1:8080/ | tee out/serve.log
          grep -qx 'hello from aios' out/serve.log
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = 405 ]
          docker inspect -f 'user={{.Config.User}} ro={{.HostConfig.ReadonlyRootfs}} cap_drop={{.HostConfig.CapDrop}} sec={{.HostConfig.SecurityOpt}} init={{.HostConfig.Init}}' "$cid" | tee out/inspect.log
          grep -q 'user=65532:65532 ro=true cap_drop=\[ALL\]' out/inspect.log
          grep -q 'no-new-privileges:true' out/inspect.log
          # 中の serve は 65532 で、PID 1 は init (tini)
          docker top "$cid" -o user,pid,args
          docker top "$cid" -o user,pid,args | grep -q '^65532 .*serve'
          docker compose -f docker/compose.yml down

      - name: Test gitea
        run: |
          # 名前つきボリュームには image の /var/lib/gitea (65532 の持ち主と、SCRIPT_TYPE = sh のはじめの app.ini) が写る。
          # gitea web は GITEA__ の環境変数を読まないので、はじめに config edit-ini で app.ini に入れる
          docker volume create gitea-ci
          docker run --rm -v gitea-ci:/var/lib/gitea \
            -e GITEA__security__INSTALL_LOCK=true -e GITEA__database__DB_TYPE=sqlite3 \
            -e GITEA__repository__ENABLE_PUSH_CREATE_USER=true \
            aios-gitea:ci --config /var/lib/gitea/custom/conf/app.ini config edit-ini --apply-env --in-place
          # 読むだけの根、cap なし、no-new-privileges、65532 で
          docker run -d --name gitea-ci -p 127.0.0.1:3000:3000 -v gitea-ci:/var/lib/gitea \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges aios-gitea:ci
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/version; then ok=1; break; fi
            sleep 2
          done
          docker logs gitea-ci 2>&1 | tail -20
          [ -n "$ok" ]
          docker exec gitea-ci gitea admin user create --username ci --password 'ci-pass-1234' \
            --email ci@example.com --admin --must-change-password=false
          # git の push: フック (pre-receive、post-receive) は image の中の sh (aish) と env と cat などで動く
          git init -q -b main out/hello
          echo hello > out/hello/README
          git -C out/hello add README
          git -C out/hello -c user.name=ci -c user.email=ci@example.com commit -qm first
          git -C out/hello push http://ci:ci-pass-1234@127.0.0.1:3000/ci/hello.git main
          docker logs gitea-ci 2>&1 | grep -E 'hook/(pre|post)-receive/ci/hello.* 200 OK'
          # push のあとの記録 (リポジトリが空でなくなる) は gitea のうしろの queue で。それまで commits は 409
          head=$(git -C out/hello rev-parse HEAD)
          for i in $(seq 1 30); do
            curl -fsS -u ci:ci-pass-1234 http://127.0.0.1:3000/api/v1/repos/ci/hello/commits > out/commits.json 2>/dev/null &&
              grep -q "$head" out/commits.json && break
            sleep 1
          done
          cat out/commits.json
          grep -q "$head" out/commits.json
          # シェルとして使えるのは sh だけで、パッケージの道具はない
          if docker exec gitea-ci ap -V 2>/dev/null; then echo "aios-gitea has ap"; exit 1; fi
          docker rm -f gitea-ci
          docker volume rm gitea-ci

      - name: Test redis
        run: |
          # 守りのまま (読むだけの根、cap なし、no-new-privileges、65532)。データは名前つきボリューム (image の /data が写る)
          docker volume create redis-ci
          docker run -d --name redis-ci --network host -v redis-ci:/data --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges aios-redis:ci redis-server --protected-mode no --port 6390
          for i in $(seq 1 20); do docker exec redis-ci redis-cli -p 6390 ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          docker exec redis-ci redis-cli -p 6390 set k aios
          [ "$(docker exec redis-ci redis-cli -p 6390 get k)" = aios ]
          # fork した子が書く (BGSAVE)。起きるときの arm64 のたしかめ (/proc/self/smaps) も通っている
          docker exec redis-ci redis-cli -p 6390 bgsave
          for i in $(seq 1 20); do docker exec redis-ci redis-cli -p 6390 info persistence | grep -q 'rdb_bgsave_in_progress:0' && break; sleep 1; done
          docker exec redis-ci redis-cli -p 6390 info persistence | grep 'rdb_last_bgsave_status:ok'
          docker logs redis-ci 2>&1 | tail -5
          docker inspect -f 'user={{.Config.User}} ro={{.HostConfig.ReadonlyRootfs}}' redis-ci
          docker rm -f redis-ci
          docker volume rm redis-ci

      - name: Test postgres
        run: |
          # 公式の postgres と同じ約束: POSTGRES_USER / PASSWORD / DB、/docker-entrypoint-initdb.d の .sql (ai/at の
          # configs/postgres/init/init.sql と同じく DB を作る)、PGDATA は /var/lib/postgresql/18/docker
          mkdir -p out/pginit
          printf 'CREATE DATABASE plc;\nCREATE DATABASE bsky;\n' > out/pginit/init.sql
          pw="ci-$(openssl rand -hex 8)"
          docker volume create pg-ci
          docker run -d --name pg-ci -p 127.0.0.1:5439:5432 -v pg-ci:/var/lib/postgresql -v "$PWD/out/pginit:/docker-entrypoint-initdb.d:ro" \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=ci \
            --read-only --tmpfs /tmp --tmpfs /run/postgresql --cap-drop ALL --security-opt no-new-privileges aios-postgres:ci
          ok=
          for i in $(seq 1 30); do
            if docker exec pg-ci pg_isready -U postgres -d ci; then ok=1; break; fi
            sleep 2
          done
          docker logs pg-ci 2>&1 | tail -20
          [ -n "$ok" ]
          # 外から (TCP、scram-sha-256 のパスワード) つないで、init.sql の DB と pg_trgm (bsky が使う contrib)
          docker run --rm --network host -e PGPASSWORD="$pw" aios-postgres:ci psql -h 127.0.0.1 -p 5439 -U postgres -d ci -Atc \
            "SELECT datname FROM pg_database WHERE datname IN ('plc','bsky','ci') ORDER BY 1" | tee out/pgdbs.log
          [ "$(cat out/pgdbs.log | tr '\n' ' ')" = "bsky ci plc " ]
          docker run --rm --network host -e PGPASSWORD="$pw" aios-postgres:ci psql -h 127.0.0.1 -p 5439 -U postgres -d bsky -Atc \
            "CREATE EXTENSION pg_trgm; SELECT similarity('aios', 'aios-postgres') > 0"
          # パスワードがちがえばつながらない
          if docker run --rm --network host -e PGPASSWORD=wrong aios-postgres:ci psql -h 127.0.0.1 -p 5439 -U postgres -d ci -c 'select 1'; then exit 1; fi
          # 起こしなおしても init はしない (PG_VERSION がある)
          docker restart pg-ci
          for i in $(seq 1 30); do docker exec pg-ci pg_isready -U postgres -d ci && break; sleep 2; done
          docker logs pg-ci 2>&1 | grep -c 'init process complete' | grep -qx 1
          docker inspect -f 'user={{.Config.User}} ro={{.HostConfig.ReadonlyRootfs}}' pg-ci
          docker rm -f pg-ci
          docker volume rm pg-ci

      - name: Test compose database and redis (docker/bluesky-social)
        run: |
          # compose.yml のまま (守り、env_file、configs と data の置き場、healthcheck) で、image だけここで作ったものに
          c=docker/bluesky-social
          pw="ci-$(openssl rand -hex 8)"
          mkdir -p $c/envs $c/configs/postgres/init $c/data/postgres $c/data/redis
          for f in plc pds bsky bsync bgs social-app ozone jetstream; do : > $c/envs/$f; done
          printf 'POSTGRES_USER=pg\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=healthcheck\n' "$pw" > $c/envs/postgres
          printf 'CREATE DATABASE pds;\nCREATE DATABASE bsky;\n' > $c/configs/postgres/init/init.sql
          # 中は 65532 で動く (root で起きて chown しない) ので、data の置き場は 65532 のものに
          sudo chown 65532:65532 $c/data/postgres $c/data/redis
          printf 'services:\n  database:\n    image: aios-postgres:ci\n  redis:\n    image: aios-redis:ci\n' > out/compose-ci.yml
          dc() { docker compose -f $c/compose.yml -f out/compose-ci.yml "$@"; }
          dc up -d --wait database redis || { dc logs database redis | tail -40; exit 1; }
          dc ps
          # healthcheck は Unix ソケットなので、初めの (TCP なしの) あいだも通る。TCP で待つ
          for i in $(seq 1 30); do dc exec -T database pg_isready -h 127.0.0.1 -U pg -d healthcheck && break; sleep 2; done
          dc exec -T -e PGPASSWORD="$pw" database psql -h 127.0.0.1 -U pg -d pds -Atc \
            "SELECT datname FROM pg_database WHERE datname IN ('pds','bsky','healthcheck') ORDER BY 1" | tee out/compose-dbs.log
          [ "$(tr '\n' ' ' < out/compose-dbs.log)" = "bsky healthcheck pds " ]
          if dc exec -T -e PGPASSWORD=wrong database psql -h 127.0.0.1 -U pg -d pds -c 'select 1'; then exit 1; fi
          dc exec -T redis redis-cli set k aios
          [ "$(dc exec -T redis redis-cli get k)" = aios ]
          dc exec -T redis redis-cli bgsave
          for i in $(seq 1 20); do dc exec -T redis redis-cli info persistence | grep -q 'rdb_bgsave_in_progress:0' && break; sleep 1; done
          dc exec -T redis redis-cli info persistence | grep 'rdb_last_bgsave_status:ok'
          sudo ls -ln $c/data/redis/dump.rdb $c/data/postgres/18/docker/PG_VERSION
          for s in database redis; do
            docker inspect -f "$s user={{.Config.User}} ro={{.HostConfig.ReadonlyRootfs}} cap_drop={{.HostConfig.CapDrop}}" "$(dc ps -q $s)" | tee -a out/compose-inspect.log
          done
          [ "$(grep -c 'user=65532:65532 ro=true cap_drop=\[ALL\]' out/compose-inspect.log)" = 2 ]
          dc down
          sudo rm -rf $c/data $c/configs $c/envs

      - name: Test plc (docker/bluesky-social/did-method-plc)
        run: |
          # atproto の DID PLC (did-method-plc)。builder (aios) で pnpm の install と build、aios-node で動かす
          git clone -q https://github.com/did-method-plc/did-method-plc out/plc
          git -C out/plc checkout -q 29f1a70ee9f6f80a25946cac103b2f745e371334
          args="--build-arg AIOS=aios:ci --build-arg AIOS_NODE=aios-node:ci -f docker/bluesky-social/did-method-plc/Dockerfile out/plc"
          docker build -t aios-plc:local $args
          docker build -t aios-plc-build:local --target build $args
          docker images aios-plc
          # Postgres と、守りのまま (読むだけの根、cap なし、no-new-privileges、65532) の plc
          pw="ci-$(openssl rand -hex 8)"
          creds="{\"username\":\"postgres\",\"password\":\"$pw\",\"host\":\"database\",\"port\":\"5432\",\"database\":\"plc\"}"
          # sysctl は compose.yml と同じもの (IPv6 のものはコメント: Docker 26.0.2 からは IPv4 だけのネットワークの eth0 は IPv6 なし)
          c=docker/bluesky-social
          mkdir -p $c/envs && for f in postgres plc pds bsky bsync bgs social-app ozone jetstream; do : > $c/envs/$f; done
          sysctls() { docker compose -f $c/compose.yml config --format json | jq -r --arg s "$1" '.services[$s].sysctls | to_entries[] | "--sysctl=\(.key)=\(.value)"'; }
          mapfile -t db_sysctls < <(sysctls database)
          mapfile -t plc_sysctls < <(sysctls plc)
          printf '%s\n' "${db_sysctls[@]}" | tee out/plc-sysctls.log
          grep -qx -- '--sysctl=net.ipv4.conf.all.accept_redirects=0' out/plc-sysctls.log
          docker network create plc-ci
          docker run -d --name database --network plc-ci "${db_sysctls[@]}" -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=plc \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges aios-postgres:ci
          for i in $(seq 1 30); do docker exec database pg_isready -U postgres -d plc && break; sleep 2; done
          docker run -d --name plc --network plc-ci "${plc_sysctls[@]}" -p 127.0.0.1:2582:3000 --init --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e ENABLE_MIGRATIONS=true -e DB_CREDS_JSON="$creds" -e DB_MIGRATE_CREDS_JSON="$creds" aios-plc:local
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2582/_health; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs plc 2>&1 | tail -20
          [ -n "$ok" ]
          # DID を作って (genesis の op に署名して送り)、もどってきた document をたしかめる
          docker run --rm --network host -w /app/packages/server aios-plc-build:local node --input-type=module -e '
            import { Client } from "@did-plc/lib";
            import { Secp256k1Keypair } from "@atproto/crypto";
            const key = await Secp256k1Keypair.create();
            const c = new Client("http://127.0.0.1:2582");
            const did = await c.createDid({ signingKey: key.did(), handle: "ci.example.com", pds: "https://pds.example.com", rotationKeys: [key.did()], signer: key });
            const data = await c.getDocumentData(did);
            console.log(did, JSON.stringify(data));
            if (!did.startsWith("did:plc:") || data.alsoKnownAs[0] !== "at://ci.example.com") process.exit(1);'
          docker exec plc node -e 'const f = (i, k) => require("fs").readFileSync(`/proc/sys/net/ipv6/conf/${i}/${k}`, "utf8").trim(); for (const i of ["all", "default", "lo", "eth0"]) console.log(i, ["disable_ipv6", "accept_ra", "accept_redirects", "accept_source_route", "forwarding"].map((k) => `${k}=${f(i, k)}`).join(" ")); const v6 = Object.entries(require("os").networkInterfaces()).filter(([n]) => n !== "lo").flatMap(([, a]) => a).filter((a) => a.family === "IPv6"); console.log("ipv6 (lo のほか)", v6.length); if (f("eth0", "disable_ipv6") !== "1" || v6.length) process.exit(1)'
          docker exec database coreutils cat /proc/sys/net/ipv6/conf/eth0/disable_ipv6 | grep -qx 1
          docker inspect -f 'user={{.Config.User}} ro={{.HostConfig.ReadonlyRootfs}} cap_drop={{.HostConfig.CapDrop}}' plc | tee out/plc-inspect.log
          grep -q 'user=65532:65532 ro=true cap_drop=\[ALL\]' out/plc-inspect.log
          docker rm -f plc database
          docker network rm plc-ci

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for f in out/*.ref; do
            n=$(basename "$f" .ref)
            read -r ref digest < "$f"
            name=${ref%%:*}
            ver=${ref#*:}
            for tag in "$ver" latest; do
              dst=ghcr.io/$owner/$name:$tag
              # いまの manifest の digest (無ければ空)
              have=$(skopeo inspect --raw "docker://$dst" 2>/dev/null | sha256sum | cut -d' ' -f1)
              if [ "sha256:$have" = "$digest" ]; then
                echo "$dst: up to date ($digest)"
              else
                skopeo copy --preserve-digests "oci-archive:out/$n.tar" "docker://$dst"
              fi
            done
            echo "- \`ghcr.io/$owner/$name:$ver\` \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
