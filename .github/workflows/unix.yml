# main ブランチ (前の unix。unix ブランチはそのときのまま残してある): aios.img を作り、QEMU (UEFI → aiboot → カーネル) で起動を確かめて、
# リリース latest (タイトル aios) に aios-aarch64.img.zst を置く (前の main の Linux のものはリリース linux)。
# ノートの 1 行目が版 ( - vVER)。使いかたは bin/run.sh
#   base, aikernel, aiboot はこのコミットのソースから。ほかのパッケージは ai/repo から
name: unix

on:
  push:
    branches:
    - main
    # イメージ (base, aikernel, aiboot をこのソースから、ほかは ai/repo から) が変わらないものでは動かさない
    paths-ignore:
    - '**.md'
    - '.claude/**'
    - '.github/workflows/pkg.yml'
    - 'pkg/ci.json'
    - 'pkg/c/**'
    - 'pkg/rust/uv/**'
    - 'pkg/desktop/**'
    - 'pkg/pkg.json'
    - 'pkg/upstream.json'
    - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unix-release
  cancel-in-progress: true

jobs:
  release:
    name: Release
    # arm64 の Linux: aarch64 のパッケージをそのままビルドできる
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # パッケージの版 (0.0.1.rN) にコミットの数を使う
          fetch-depth: 0

      - name: kernel.json
        # カーネルの地図 (kernel/kernel.json: ファイルごとの core と extra、quirk の一覧) とソースがそろっているか
        run: python3 test/kernel-json.py

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl zstd fdisk dosfstools mtools e2fsprogs fakeroot \
            qemu-system-arm qemu-efi-aarch64
          # arm64 の Ubuntu では、ふつうの gcc が aarch64-linux-gnu-gcc (ring の C の部分に)
          command -v aarch64-linux-gnu-gcc

      - name: Install Rust
        run: |
          # edition 2024 なので新しい stable を
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-none-softfloat aarch64-unknown-linux-musl aarch64-unknown-uefi

      - name: crypto.rs
        # カーネルの乱数の部品 (kernel/src/crypto.rs の ChaCha20 と BLAKE2s) をこのマシンでビルドして、RFC の例、
        # Python の hashlib、openssl と答え合わせ
        run: python3 test/crypto.py

      - name: tlsf.rs
        # カーネルのヒープの空きの管理 (kernel/src/tlsf.rs) をこのマシンでビルドして、でたらめに取り・返して確かめる
        # (重なり、つながり、リストとビット、ぜんぶ返したら区画ごとに 1 つに戻るか)
        run: python3 test/heap.py

      - name: Build aios.img
        run: |
          git config user.name ai
          git config user.email ai@syui.ai
          AIOS_BUILD="base aikernel aiboot" bin/mkrootfs.sh -r all
          SWAP=1G bin/mkdisk.sh 8G

      - name: aish tests
        # base を作ったときの aish とプラグイン (aarch64 の musl。この arm64 の Linux でそのまま動く)
        run: |
          sh test/aish.sh user/target/aarch64-unknown-linux-musl/release/aish shell/target/aarch64-unknown-linux-musl/release
          # プラグインのユニットテスト (aish-fix のエラーの数えかた、aish-pkg の版くらべ、aish-vm の lockbench の読みかた、aish-local の答えのほどきかたなど)
          (cd shell && cargo test --release -p aish-edit -p aish-fetch -p aish-fix -p aish-pkg -p aish-vm -p aish-local)

      - name: Boot test
        run: |
          # UEFI → aiboot → カーネル → init → swap.service まで来るか。
          # Mac の HVF と同じ GICv3 (仮想タイマ) で。GICv2 は次の VM test で起こす
          # ファームウェアは 2 つ: Ubuntu の AAVMF と、QEMU についてくる edk2 (Mac の Homebrew の qemu が使うもの。
          # v11.1.2 のものは edk2-stable202408)。edk2 は実行するセクションを読むだけにするので、
          # カーネルの .data が .text と同じセクションにあると、そこに書いたところで落ちる (AAVMF では起きる)
          mkdir -p build
          for u in https://gitlab.com/qemu-project/qemu/-/raw/v11.1.2/pc-bios/edk2-aarch64-code.fd.bz2 \
              https://github.com/qemu/qemu/raw/v11.1.2/pc-bios/edk2-aarch64-code.fd.bz2; do
            curl -fsSL -o build/edk2-aarch64-code.fd.bz2 "$u" && break
          done
          echo "c023444108b7a132fdebf70c4765cd2dd9af2a9ff7d001a743aaabe87c20a458  build/edk2-aarch64-code.fd.bz2" | sha256sum -c
          bunzip2 -f build/edk2-aarch64-code.fd.bz2
          for fw in aavmf edk2; do
            code=
            [ $fw = edk2 ] && code=$PWD/build/edk2-aarch64-code.fd
            # 変数はファームウェアごとに作りなおす
            rm -f build/efivars.fd
            AIOS_GIC=3 AIOS_EFI_CODE=$code bin/run.sh < /dev/null > boot.log 2>&1 &
            ok=
            for i in $(seq 1 150); do
              if grep -q '^aios init:' boot.log && grep -q '^swap: /dev/vda3' boot.log; then
                ok=1
                break
              fi
              grep -q 'Synchronous Exception' boot.log && break
              sleep 2
            done
            sleep 5
            pkill -f '^qemu-system-aarch64' || true
            wait || true
            echo "== $fw (gic 3)"
            cat boot.log
            [ -n "$ok" ] || exit 1
          done
          rm -f build/efivars.fd

      - name: Build C tests
        # カーネルの C のテスト (test/*.c) を静的なプログラムに (arm64 の Ubuntu の gcc)。VM test で中から取って動かす。
        # ロボット (test/sysdiff.c) も。test/sysdiff/ の Linux の答えを作ったときの sysdiff.c でなければ止まる
        run: |
          sh test/vm-ctests.sh build gcc
          sh test/sysdiff-ci.sh build gcc

      - name: mem.S test
        # カーネルの memcpy / memmove / memset (kernel/src/mem.S) を、長さとずれと重なりのすべてで libc のものとくらべる
        run: sh test/mem.sh gcc

      - name: VM test
        run: |
          # GICv2 で起こしてプロンプトまで待ち、中で短いたしかめ (test/vm-check.sh: /sys と /proc、
          # イメージのコマンド、sh の名前の aish、sudo)。シリアルの端末を test/vm.py が持つ
          start=$(python3 test/vm.py start --www test)
          echo "$start"
          if ! echo "$start" | grep -q '"ready": true'; then
            python3 test/vm.py log 80
            python3 test/vm.py stop || true
            exit 1
          fi
          st=0
          # たしかめるスクリプトは test/ を http で見せて、中から取る (put は端末から流しこむので、
          # base64 が読みはじめる前に 4 KiB をこえるとあふれる)
          python3 test/vm.py run 'fetch http://10.0.2.2:8000/vm-check.sh > /tmp/vm-check.sh && sh /tmp/vm-check.sh' -t 600 || st=$?
          # カーネルの C のテスト (test/vm-ctests.sh。clone3、execve、getdents、landlock、seccomp、namespace など)
          python3 test/vm.py run 'fetch http://10.0.2.2:8000/vm-ctests.sh > /tmp/vm-ctests.sh && sh /tmp/vm-ctests.sh run' -t 1200 || st=$?
          # Linux と答えあわせ (test/sysdiff-ci.sh): ext4 と tmpfs の 800 case を動かし、test/sysdiff/ の Linux の答えとくらべる
          if python3 test/vm.py run 'fetch http://10.0.2.2:8000/sysdiff-ci.sh > /tmp/sd.sh && sh /tmp/sd.sh run' -t 1200; then
            sh test/sysdiff-ci.sh compare || st=1
          else
            st=1
          fi
          # ここまでのどれかが、大きなロック (BKL) が守るもの (kernel/src/cell.rs の Bkl) を BKL なしで触っていない
          python3 test/vm.py run '! grep "^unlocked" /proc/bkl' -t 60 || st=1
          # 失敗したら、シリアルの終わりを見せる (中で何が起きたか)
          [ "$st" = 0 ] || python3 test/vm.py log 60
          python3 test/vm.py stop || true
          exit $st

      - name: Assets
        run: |
          mkdir release
          zstd -q -19 -T0 aios.img -o release/aios-aarch64.img.zst
          ver=$(ls repo/aarch64/rust/aikernel-*.pkg.tar.zst | sed 's|.*/aikernel-||; s|-aarch64.pkg.tar.zst||')
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf ' - v%s\n\n' "$VER" > notes.md
          cat >> notes.md <<'NOTES'
          ```sh
          # brew install qemu zstd
          git clone https://git.syui.ai/ai/os aios && cd aios
          curl -fLO https://github.com/syui/aios/releases/download/latest/aios-aarch64.img.zst
          ./bin/run.sh
          ```

          exit: `sudo poweroff`
          NOTES
          # 前の名前 (unix-latest) のリリースがのこっていれば、それも消す
          for t in latest unix-latest; do gh release delete "$t" --yes --cleanup-tag || true; done
          # GitHub の Latest の印はこれに (linux ブランチの release linux は --latest=false で取らない)
          gh release create latest release/* --title aios --notes-file notes.md --target "$GITHUB_SHA" --latest
